name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install build dependencies
        run: uv sync --all-extras

      - name: Run lint suite
        run: uv run ruff check .

      - name: Run automated test suite
        run: uv run pytest -v

      - name: Build Standalone Executable & Setup Installer
        run: uv run python scripts/build_installer.py

      - name: Generate SHA256 checksums
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/WinTokenMon-*-Portable.exe
            dist/WinTokenMon-Setup-*.exe
            dist/*.exe.sha256
